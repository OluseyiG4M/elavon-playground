<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Elavon Playground</title>
</head>

<style>
    .rows {
        display: flex;
        flex-direction: column;
        padding: 20px;
        align-content: center;
    }

    .columns {
        display: flex;
        flex-direction: row;
        padding: 20px;
        align-content: center;
    }
    
    .formItem {
        padding: 5px;
        margin-bottom: 10px;
    }

    #google-pay-button {
        margin-top: 10px;
    }
</style>

<script src="https://uat.hpp.converge.eu.elavonaws.com/client/library.js"></script>
<script async src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>

<script>
    const MessageTypes = window.ElavonLightbox.MessageTypes;

    let paymentsClient = null;
    let googlePayConfig = {
        environment: 'TEST',
        merchantInfo: {
            merchantName: 'Example Merchant',
            merchantId: '24ktxxdw8jpbjkcc3mb79jqxhbwk'
        }
    };

    const submitData = async (data) => {
        // send data to your server
        console.log(data);
        const response = await fetch('http://localhost:8080/v1/get-epg-transaction', {
            method: 'POST',
            body: JSON.stringify({
                session_id: data.sessionId,
            }),
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const responseJson = await response.json();
        document.getElementById('result').innerHTML = JSON.stringify(responseJson, null, 4);
    };

    const createEpgTransaction = async (amount, orderNumber, email = '') => {
        const response = await fetch('http://localhost:8080/v1/create-epg-order-and-session', {
            method: 'POST',
            body: JSON.stringify({
                amount: amount,
                order_number: orderNumber,
                email: email
            }),
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const responseJson = await response.json();
        document.getElementById('result').innerHTML = '<div>NOW LOADING ELAVON HOSTED PAYMENT PAGE...</div><div>Current Session details:</div>' + JSON.stringify(responseJson, null, 4);
        let lightbox;
        console.log(responseJson);
        const sessionId = responseJson.session.id;
        console.log(sessionId);
        if (!lightbox) {
            lightbox = new window.ElavonLightbox({
                sessionId: sessionId,
                onReady: (error) =>
                    error
                        ? console.error('Lightbox failed to load')
                        : lightbox.show(),
                messageHandler: (message, defaultAction) => {
                    switch (message.type) {
                        case MessageTypes.transactionCreated:
                            submitData({
                                sessionId: message.sessionId,
                            });
                            break;
                    }
                    defaultAction();
                },
            });
        } else {
            lightbox.show();
        }
    }

    const getEpgTransaction = async (transactionId, sessionId) => {
        const response = await fetch('http://localhost:8080/v1/get-epg-transaction', {
            method: 'POST',
            body: JSON.stringify({
                transaction_id: transactionId ?? null,
                session_id: sessionId?? null
            }),
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const responseJson = await response.json(); //extract JSON from the http response
        document.getElementById('result').innerHTML = JSON.stringify(responseJson, null, 4);
    }

    const createPmgTransaction = async (amount, orderNumber, paymentMethod, currencyCode, countryCode, tradingBrand, redirectUrl) => {
        const response = await fetch('http://localhost:8080/v1/create-pmg-transaction', {
            method: 'POST',
            body: JSON.stringify({
                amount: amount,
                order_number: orderNumber,
                payment_method: paymentMethod,
                currency_code: currencyCode,
                country_code: countryCode,
                trading_brand: tradingBrand,
                redirect_url: redirectUrl
            }),
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const responseJson = await response.json(); //extract JSON from the http response
        document.getElementById('result').innerHTML = JSON.stringify(responseJson, null, 4);
    }

    const getPmgTransaction = async (transactionId) => {
        const response = await fetch('http://localhost:8080/v1/get-pmg-transaction', {
            method: 'POST',
            body: JSON.stringify({
                transaction_id: transactionId,
            }),
            headers: {
                'Content-Type': 'application/json'
            }
        });
        const responseJson = await response.json(); //extract JSON from the http response
        document.getElementById('result').innerHTML = JSON.stringify(responseJson, null, 4);
    }

    function onGooglePayLoaded() {
        paymentsClient = new google.payments.api.PaymentsClient({
            environment: googlePayConfig.environment
        });
        console.log('Google Pay loaded successfully');
    }

    function getGooglePaymentDataRequest(amount, currencyCode) {
        const baseRequest = {
            apiVersion: 2,
            apiVersionMinor: 0
        };

        const tokenizationSpecification = {
            type: 'PAYMENT_GATEWAY',
            parameters: {
                gateway: 'convergepay',
                gatewayMerchantId: googlePayConfig.merchantInfo.merchantId
            }
        };

        const cardPaymentMethod = {
            type: 'CARD',
            parameters: {
                allowedAuthMethods: ['PAN_ONLY', 'CRYPTOGRAM_3DS'],
                allowedCardNetworks: ['MASTERCARD', 'VISA']
            },
            tokenizationSpecification: tokenizationSpecification
        };

        return Object.assign({}, baseRequest, {
            allowedPaymentMethods: [cardPaymentMethod],
            transactionInfo: {
                totalPriceStatus: 'FINAL',
                totalPrice: amount.toString(),
                currencyCode: currencyCode,
                countryCode: 'GB'
            },
            merchantInfo: googlePayConfig.merchantInfo
        });
    }

    async function checkGooglePayAvailability() {
        try {
            const isReadyToPayRequest = {
                apiVersion: 2,
                apiVersionMinor: 0,
                allowedPaymentMethods: [{
                    type: 'CARD',
                    parameters: {
                        allowedAuthMethods: ['PAN_ONLY', 'CRYPTOGRAM_3DS'],
                        allowedCardNetworks: ['AMEX', 'MASTERCARD', 'VISA']
                    }
                }]
            };

            const response = await paymentsClient.isReadyToPay(isReadyToPayRequest);
            if (response.result) {
                console.log('Google Pay is available');
                document.getElementById('google-pay-button').style.display = 'block';
            } else {
                console.log('Google Pay is not available');
                document.getElementById('result').innerHTML = 'Google Pay is not available on this device/browser';
            }
        } catch (err) {
            console.error('Error checking Google Pay availability:', err);
            document.getElementById('result').innerHTML = 'Error checking Google Pay: ' + err.message;
        }
    }

    async function initiateGooglePayPayment() {
        const amount = parseFloat(document.getElementById('googlepay-amount').value);
        const orderNumber = document.getElementById('googlepay-order-number').value;
        const currencyCode = document.getElementById('googlepay-currency-code').value || 'GBP';

        if (!amount || !orderNumber) {
            alert('Please enter amount and order number');
            return;
        }

        try {
            document.getElementById('result').innerHTML = 'Initiating Google Pay...';

            const paymentDataRequest = getGooglePaymentDataRequest(amount, currencyCode);
            console.log('Payment Request Data', paymentDataRequest);
            const paymentData = await paymentsClient.loadPaymentData(paymentDataRequest);

            console.log('Payment data received:', paymentData);

            await processGooglePayPayment(paymentData, amount, orderNumber, currencyCode);

        } catch (err) {
            console.error('Google Pay error:', err);
            if (err.statusCode === 'CANCELED') {
                document.getElementById('result').innerHTML = 'Payment cancelled by user';
            } else {
                document.getElementById('result').innerHTML = 'Error: ' + JSON.stringify(err, null, 4);
            }
        }
    }

    async function processGooglePayPayment(paymentData, amount, orderNumber, currencyCode) {
        try {
            const response = await fetch('http://localhost:8080/v1/create-googlepay-payment-epg', {
                method: 'POST',
                body: JSON.stringify({
                    payment_data: paymentData,
                    amount: amount,
                    order_number: orderNumber,
                    currency_code: currencyCode,
                    email: document.getElementById('googlepay-email').value || 'customer@example.com'
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const responseJson = await response.json();
            document.getElementById('result').innerHTML = '<div>Google Pay Payment Result:</div>' + JSON.stringify(responseJson, null, 4);

        } catch (err) {
            console.error('Error processing Google Pay payment:', err);
            document.getElementById('result').innerHTML = 'Error processing payment: ' + err.message;
        }
    }

    async function getGooglePayPayment() {
        const paymentId = document.getElementById('googlepay-payment-id').value;

        if (!paymentId) {
            alert('Please enter a payment ID');
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/v1/get-googlepay-payment-epg', {
                method: 'POST',
                body: JSON.stringify({
                    payment_id: paymentId
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const responseJson = await response.json();
            document.getElementById('result').innerHTML = JSON.stringify(responseJson, null, 4);

        } catch (err) {
            console.error('Error getting Google Pay payment:', err);
            document.getElementById('result').innerHTML = 'Error: ' + err.message;
        }
    }
</script>

<body>

<h1>Elavon Playground</h1>

<div class="columns">
    <div class="rows">
        <h2>Blik (Elavon Payment Gateway)</h2>

        <div class="rows">
            <h3>Create Transaction</h3>

            <label for="epg-amount">Amount</label>
            <input id="epg-amount" type="text" value="" class="formItem"/>
            <label for="epg-order-number">Order Number</label>
            <input id="epg-order-number" type="text" value="" class="formItem"/>
            <label for="epg-email">Customer Email</label>
            <input id="epg-email" type="text" value="" class="formItem"/>

            <button class="formItem" onclick="createEpgTransaction(
                parseFloat(document.getElementById('epg-amount').value),
                document.getElementById('epg-order-number').value,
                document.getElementById('epg-email').value
            )">
                Make Payment
            </button>

        </div>

        <div class="rows">
            <h3>Get Transaction</h3>
            <label for="epg-transaction-id">Transaction ID</label>
            <input id="epg-transaction-id" type="text" value="" class="formItem"/>

            <label for="epg-session-id">Session ID</label>
            <input id="epg-session-id" type="text" value="" class="formItem"/>

            <button class="formItem" onclick="getEpgTransaction(
                document.getElementById('epg-transaction-id').value,
                document.getElementById('epg-session-id').value
            )">
                Get Transaction
            </button>
        </div>
    </div>

    <div class="rows">
        <h2>iDeal/p24 (Payment Method Gateway)</h2>
        <div class="rows">
            <h3>Create Transaction</h3>
            <label for="pmg-amount">Amount</label>
            <input id="pmg-amount" type="text" value="" class="formItem"/>
            <label for="pmg-order-number">Order Number</label>
            <input id="pmg-order-number" type="text" value="" class="formItem"/>
            <label for="pmg-payment-method">Payment Method</label>
            <select name="pmg-payment-method" id="pmg-payment-method" class="formItem">
                <option value="ideal">ideal</option>
                <option value="p24">p24</option>
            </select>
            <label for="pmg-currency-code">Currency Code</label>
            <input id="pmg-currency-code" type="text" value="" class="formItem"/>
            <label for="pmg-country-code">Country Code</label>
            <input id="pmg-country-code" type="text" value="" class="formItem"/>
            <label for="pmg-trading-brand">Trading Brand</label>
            <select name="pmg-trading-brand" id="pmg-trading-brand" class="formItem">
                <option value="Gear4music">Gear4music</option>
                <option value="AV.com">AV.com</option>
            </select>
            <label for="pmg-redirect-url">Redirect URL</label>
            <input id="pmg-redirect-url" type="text" value="" class="formItem"/>

            <button class="formItem" onclick="createPmgTransaction(
                parseFloat(document.getElementById('pmg-amount').value),
                document.getElementById('pmg-order-number').value,
                document.getElementById('pmg-payment-method').value,
                document.getElementById('pmg-currency-code').value,
                document.getElementById('pmg-country-code').value,
                document.getElementById('pmg-trading-brand').value,
                document.getElementById('pmg-redirect-url').value
        )">Make Payment
            </button>
        </div>

        <div class="rows">
            <h3>Get Transaction</h3>
            <label for="pmg-transaction-id">Transaction ID</label>
            <input id="pmg-transaction-id" type="text" value="" class="formItem"/>

            <button class="formItem" onclick="getPmgTransaction(
                document.getElementById('pmg-transaction-id').value
            )">
                Get Transaction
            </button>
        </div>
    </div>

    <div class="rows">
        <h2>Google Pay (EPG)</h2>
        <div class="rows">
            <h3>Create Payment</h3>
            <label for="googlepay-amount">Amount</label>
            <input id="googlepay-amount" type="text" value="" class="formItem" placeholder="10.00"/>

            <label for="googlepay-order-number">Order Number</label>
            <input id="googlepay-order-number" type="text" value="" class="formItem" placeholder="ORDER-123"/>

            <label for="googlepay-currency-code">Currency Code</label>
            <input id="googlepay-currency-code" type="text" value="GBP" class="formItem" placeholder="GBP"/>

            <label for="googlepay-email">Customer Email</label>
            <input id="googlepay-email" type="text" value="" class="formItem" placeholder="customer@example.com"/>

            <button class="formItem" onclick="checkGooglePayAvailability()">
                Check Google Pay Availability
            </button>

            <div id="google-pay-button" style="display: none;">
                <button class="formItem" onclick="initiateGooglePayPayment()">
                    Pay with Google Pay
                </button>
            </div>
        </div>

        <div class="rows">
            <h3>Get Payment</h3>
            <label for="googlepay-payment-id">Payment ID</label>
            <input id="googlepay-payment-id" type="text" value="" class="formItem"/>

            <button class="formItem" onclick="getGooglePayPayment()">
                Get Google Pay Payment
            </button>
        </div>
    </div>

    <div class="rows">
        <div>
            <h2>Result</h2>
            <div id="result" style="white-space: pre">
            </div>
        </div>
    </div>
</div>
</body>
</html>
